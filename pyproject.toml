[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-graph-builder"
version = "0.1.3"
description = "Extract and persist entity graphs from documents into Neo4j"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{ name = "LLM Graph Builder Team" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]

# Note: The internal modules currently import optional providers at import-time.
# To avoid runtime import errors, we include the full dependency set here.
dependencies = [
  "asyncio==3.4.3",
  "boto3==1.38.36",
  "botocore==1.38.36",
  "certifi==2025.6.15",
  "google-api-core==2.25.1",
  "google-auth==2.40.3",
  "google_auth_oauthlib==1.2.2",
  "google-cloud-core==2.4.3",
  "json-repair==0.39.1",
  "langchain==0.3.25",
  "langchain-aws==0.2.25",
  "langchain-anthropic==0.3.15",
  "langchain-fireworks==0.3.0",
  "langchain-community==0.3.25",
  "langchain-core==0.3.65",
  "langchain-experimental==0.3.4",
  "langchain-google-vertexai==2.0.25",
  "langchain-groq==0.3.2",
  "langchain-openai==0.3.23",
  "langchain-text-splitters==0.3.8",
  "langchain-huggingface==0.3.0",
  "langdetect==1.0.9",
  "langsmith==0.3.45",
  "neo4j-rust-ext==5.28.1.0",
  "nltk==3.9.1",
  "openai==1.86.0",
  "opencv-python==4.11.0.86",
  "pydantic==2.11.7",
  "python-dotenv==1.1.0",
  "python-magic==0.4.27",
  "PyPDF2==3.0.1",
  "PyMuPDF==1.26.1",
  "starlette==0.46.2",
  "sse-starlette==2.3.6",
  "starlette-session==0.4.3",
  "tqdm==4.67.1",
  "unstructured[all-docs]==0.17.2",
  "unstructured-client==0.36.0",
  "unstructured-inference==1.0.5",
  "urllib3==2.4.0",
  "wikipedia==1.4.0",
  "wrapt==1.17.2",
  "yarl==1.20.1",
  "youtube-transcript-api==1.1.0",
  "sentence-transformers==4.1.0",
  "google-cloud-logging==3.12.1",
  "pypandoc==1.15",
  "graphdatascience==1.15.1",
  "Secweb==1.18.1",
  "ragas==0.2.15",
  "rouge_score==0.1.2",
  "langchain-neo4j==0.4.0",
  "pypandoc-binary==1.15",
  "chardet==5.2.0",
]

[tool.setuptools]
packages = ["src", "llm_graph_builder"]
package-dir = {"src" = "backend/src", "llm_graph_builder" = "backend/pkg/llm_graph_builder"}
include-package-data = true

[project.urls]
Homepage = "https://github.com/your-org/llm-graph-builder"
Issues = "https://github.com/your-org/llm-graph-builder/issues"


